name: anime_memory
description: My personal anime collection and memories.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  archive: ^3.6.1
  file_picker: ^8.1.7
  http: ^1.2.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  screenshot: ^3.0.0
  share_plus: ^10.1.2
  
  # 🔥 تم تعديل الإصدارات هنا لتجنب خطأ withValues
  video_player: 2.8.8
  chewie: 1.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - lib/anime_catalog.json