name: anime_memory
description: My personal anime collection and memories.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  archive: ^3.6.1
  file_picker: ^8.1.7
  http: ^1.2.0
  google_fonts: ^6.2.1 # 🔥 هذه هي الحزمة الجديدة التي أضفناها

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - lib/anime_catalog.json